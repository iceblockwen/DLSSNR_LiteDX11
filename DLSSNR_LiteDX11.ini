[General]
; Optional configuration directory. Supports environment variables such as %LOCALAPPDATA%.
; Empty: save beside the plugin; on write failure use a per-game user profile.
; DLSSNR_LiteDX11_CONFIG_DIR overrides this setting. The file name stays DLSSNR_LiteDX11.ini.
ConfigDirectory=
Enabled=1

[NeuralRendering]
Enabled=0
; Off by default. Turn on when the game supplies no NGX SR input (no DLSS/DLAA): the
; plugin then captures the D3D11 scene, finds a depth texture and estimates motion
; vectors itself. Also required for the Resources page depth/MV previews.
; Read at startup: changing it needs a game restart.
NativeCapture=0
; NR GPU timing follows panel visibility automatically; no configuration switch.
; 0 Game, 1 Measured, 2 Manual.
WhiteMode=0
; 0 pre-exposure / exposure; 1 exposure / pre-exposure. Game mode only; the
; texture value swaps sides with the pre-exposure, it is never inverted.
WhiteRatio=0
WhiteUseTexture=1
; Unchecked inputs substitute 1; texture retains priority over the scalar scale.
WhiteUsePreExposure=1
WhiteUseExposureScale=1
ManualWhite=1
; Multiplier on Game/Measured white; panel and config range 0.001 to 1024.
WhiteTrim=1
; Game exposure ratio exponent: white = (pre/exposure)^n * trim, or
; (exposure/pre)^n * trim when WhiteRatio=1. 1 = linear.
WhiteExponent=1
WhiteAnchor=0.18
WhiteTau=0.3
WhiteDeadband=0.08
WhiteAttack=1
WhiteRelease=0.5
WhiteEvery=4
Preset=0
Style=0
Intensity=1
Structure=1
Tone=1
Skin=-1
AutoMask=1
; Model UI correction hint (DLSSNR.UICorrection). Changing it rebuilds NR histories.
UICorrection=0
; Amplify final resolved NR difference once: 0 original, 1 normal NR, 0 to 2.
DifferenceGain=1
ComposedRestore=1

[Diagnostics]
; Log detail switch kept for future call sites. No log file is written today and
; no code path currently emits a line, so the level has no visible effect.
; 0 = off, 1 = basic, 2 = verbose.
Level=0
ResourceScale=1
; Display-only proximity contrast curve. Raw game depth and flow input remain unchanged.
DepthContrast=0

[Resources]
; Correct bottom-up depth for preview, generated MV depth checks and NR. Color/MV are unchanged.
DepthUpsideDown=0
; Depth projection parameters; affect only estimated MV, not the NR depth input.
FlowFov=60
FlowFarPlane=1000
FlowDepthMultiplier=1
FlowLogDepth=0
